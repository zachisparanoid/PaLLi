[pytest]
# Phase 0 (2026-07-16) — the suite had no config file at all: pytest
# reported `inifile: None`, `@pytest.mark.integration` was unregistered,
# and nothing pinned pytest-asyncio's mode across plugin upgrades.
#
# Everything here is deliberately behavior-neutral: collection is 2395
# tests before and after. This file declares the status quo so it stops
# being implicit, it does not change what runs.

testpaths = tests

# Silences PytestUnknownMarkWarning in the three tests/integration/ files
# that use this mark. Purely declarative — tests/integration/conftest.py
# keys off the file PATH (`"integration" in str(item.fspath)`), not this
# marker, so registering it changes no collection or gating behavior.
markers =
    integration: end-to-end test exercising real subsystems; slower than a unit test

# `strict` is pytest-asyncio's own default — pinning it is the point. All
# 936 async tests carry an explicit @pytest.mark.asyncio, so `auto` would
# start collecting unmarked async defs and silently change what runs. An
# upgrade that flips the default must not quietly reshape this suite.
asyncio_mode = strict

# NOT SET, on purpose: filterwarnings.
# STATE_OF_PALLI flags the ~84-warning noise floor as a gap, and it is one
# — but the loudest warning is a real production bug (`datetime.utcnow()`
# at core/turn/ingest.py:98, plus the reminders/session paths). Setting
# `filterwarnings = error` here would fail the suite on production debt
# rather than clean it, and setting `ignore` would bury the very signal
# the ledger wants surfaced. Fix the utcnow() callers first, then tighten
# this to error — in that order.
