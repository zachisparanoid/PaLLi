# PaLLi example configuration — copy to data/palli.yaml (a fresh boot does this for you); your name is learned at first contact, not set here.
version: 1
providers:
  openai:
    # 2026-05-21 — re-enabled as an AVAILABLE option (companion restoration
    # Phase 1). enabled:true only means "this provider may be selected"; it
    # does NOT change where lanes point. Routing under llm.routing.* still
    # decides which provider each task actually uses. Switch a lane to OpenAI
    # by setting its provider: openai there, or apply the openai-primary /
    # hybrid preset.
    enabled: true
    discovery: curated
    api_key_ref:
      source: env
      name: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    models:
      - id: gpt-4o
        display_name: GPT-4o
        context_window: 128000
        supports_vision: true
        supports_reasoning: false
      - id: gpt-4o-mini
        display_name: GPT-4o mini
        context_window: 128000
        supports_vision: false
        supports_reasoning: false
      - id: gpt-4.1-mini
        display_name: GPT-4.1 mini
        context_window: 128000
        supports_vision: false
        supports_reasoning: false
      - id: gpt-5.1-codex-max
        display_name: GPT-5.1 Codex Max
        context_window: 200000
        supports_vision: false
        supports_reasoning: true
      - id: gpt-5.2-chat-latest
        display_name: GPT-5.2 Chat
        context_window: 200000
        supports_vision: false
        supports_reasoning: false
      - id: gpt-5-mini
        display_name: GPT-5 mini
        context_window: 200000
        supports_vision: false
        supports_reasoning: true
      - id: o1
        display_name: o1
        supports_vision: false
        supports_reasoning: true
  deepseek:
    enabled: true
    discovery: curated
    api_key_ref:
      source: env
      name: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    # 2026-05-13: per /models API, DeepSeek has moved to V4 family.
    # Old deepseek-chat / deepseek-reasoner names no longer served.
    # Both V4 variants are reasoning-prone — set max_tokens >= 200.
    models:
      - id: deepseek-v4-pro
        display_name: DeepSeek V4 Pro
        supports_vision: false
        supports_reasoning: true
      - id: deepseek-v4-flash
        display_name: DeepSeek V4 Flash
        supports_vision: false
        supports_reasoning: true
  local_openai:
    enabled: true
    discovery: api
    base_url_ref:
      source: env
      name: LOCAL_LLM_API_BASE
    models:
      # 2026-09-03: listed for its display name only (discovery: api — never validated).
      - id: qwen3.5:9b
        display_name: Qwen3.5 9B (local)
        supports_vision: false
        supports_reasoning: true
  codex:
    enabled: true
    discovery: curated
    cli_path_ref:
      source: env
      name: CODEX_CLI_PATH
    models:
      - id: gpt-5.1-codex-max
        display_name: Codex (GPT-5.1)
        supports_vision: false
        supports_reasoning: false
      - id: gpt-5.2-chat-latest
        display_name: Codex (GPT-5.2)
        supports_vision: false
        supports_reasoning: false
      - id: gpt-5.3-codex
        display_name: Codex (GPT-5.3)
        supports_vision: false
        supports_reasoning: false
      - id: gpt-5.5
        display_name: GPT-5.5
        supports_vision: false
        supports_reasoning: true
  claude:
    enabled: true
    discovery: curated
    cli_path_ref:
      source: env
      name: CLAUDE_CLI_PATH
    models:
      - id: haiku
        display_name: Claude Haiku (latest)
        supports_vision: false
        supports_reasoning: false
      - id: sonnet
        display_name: Claude Sonnet (latest)
        supports_vision: true
        supports_reasoning: false
      - id: opus
        display_name: Claude Opus (latest)
        supports_vision: true
        supports_reasoning: true
  # Anthropic HTTP API provider (distinct from `claude` CLI subprocess auth).
  # Uses the official `anthropic` Python SDK with ANTHROPIC_API_KEY from .env.
  # Wired 2026-05-13. Select per-task via routing block below.
  anthropic:
    enabled: true
    discovery: curated
    api_key_ref:
      source: env
      name: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    models:
      # 2026-09-03: the account answers on Claude 5 (verified 2026-09-02); listed so
      # presets may name them — routing validation requires curated models to be listed.
      - id: claude-opus-5
        display_name: Claude Opus 5
        supports_vision: true
        supports_reasoning: true
      - id: claude-sonnet-5
        display_name: Claude Sonnet 5
        supports_vision: true
        supports_reasoning: true
      - id: claude-opus-4-7
        display_name: Claude Opus 4.7
        supports_vision: true
        supports_reasoning: true
      - id: claude-sonnet-4-6
        display_name: Claude Sonnet 4.6
        supports_vision: true
        supports_reasoning: false
      - id: claude-haiku-4-5-20251001
        display_name: Claude Haiku 4.5
        supports_vision: false
        supports_reasoning: false
  ollama:
    enabled: true
    discovery: api
    base_url_ref:
      source: env
      name: OLLAMA_BASE_URL
    models:
      - id: qwen3:8b
        display_name: Qwen3 8B (local)
        supports_vision: false
        supports_reasoning: true
      - id: qwen3:14b
        display_name: Qwen3 14B (local)
        supports_vision: false
        supports_reasoning: true
      - id: qwen3.5:4b
        display_name: Qwen3.5 4B (local)
        supports_vision: false
        supports_reasoning: true
      - id: gemma3:12b
        display_name: Gemma 3 12B (local)
        supports_vision: false
        supports_reasoning: false
      - id: gpt-oss:20b
        display_name: gpt-oss 20B (local)
        supports_vision: false
        supports_reasoning: false
      - id: llama3.2:3b
        display_name: Llama 3.2 3B (local)
        supports_vision: false
        supports_reasoning: false
      - id: qwen3.5:9b
        display_name: Qwen3.5 9B (local)
        supports_vision: false
        supports_reasoning: true
llm:
  # Who does the thinking. Every lane ships pointed at ONE local Ollama server, so a
  # fresh install needs no API key and no account: install Ollama, pull the two models, and she runs.

  #     ollama pull qwen3.5:9b     # the nine text lanes
  #     ollama pull gemma3:12b     # the vision lane

  # Two doors, one server, on purpose. The text lanes use `local_openai` — Ollama's OpenAI-style
  # endpoint at LOCAL_LLM_API_BASE — because her tool calls are REAL there. The native `ollama`
  # door emulates them, which would leave her able to talk and unable to act (no reminders, no
  # file reads, no hands), and `palli_ctl brain` refuses that move outright. Vision goes the other
  # way: it needs the native door, which is the half of the server that has eyes.

  # The model ids are EXAMPLES. Pull what your machine can run and point her at it — never by
  # editing this file alone, because her voice (the `response` lane) is read from LLM_PROVIDER and
  # LLM_RESPONSE_MODEL in .env.local, not from here:

  #     venv/bin/python scripts/palli_ctl.py brain --pick
  #     venv/bin/python scripts/palli_ctl.py brain --lane response --to local_openai/qwen3.5:4b

  # `presets:` further down holds the cloud setups (deepseek-primary, anthropic-primary,
  # openai-primary, codex-primary, claude-oauth) and a mixed one (hybrid). Each needs its own key
  # or CLI login; none is required.
  default_provider: local_openai
  routing:
    response:
      provider: local_openai
      model: qwen3.5:9b
    decision:
      provider: local_openai
      model: qwen3.5:9b
    analysis:
      provider: local_openai
      model: qwen3.5:9b
    appraisal:
      provider: local_openai
      model: qwen3.5:9b
    memory:
      provider: local_openai
      model: qwen3.5:9b
    proactive:
      provider: local_openai
      model: qwen3.5:9b
    reflection:
      provider: local_openai
      model: qwen3.5:9b
    narrative_author:
      provider: local_openai
      model: qwen3.5:9b
    web_search:
      provider: local_openai
      model: qwen3.5:9b
    vision:
      provider: ollama
      model: gemma3:12b
voice:
  engine: classic
  # shipped keyless: faster-whisper transcribes on this machine (VOICE_LOCAL_STT_MODEL picks the size).
  # Deepgram is the hosted alternative and wants DEEPGRAM_API_KEY.
  stt_provider: faster_whisper
  # shipped keyless: pyttsx3 is the offline system voice. Lemonfox (LEMONFOX_API_KEY) sounds far better;
  # it degrades quietly to silence without the key, never a boot failure. Voice is OFF in .env.template either way.
  tts_provider: pyttsx3
  interaction_mode: direct_address
  # Batch 8 (2026-10-01, wrap): voice messages in her own voice (the voice_note tool + the voice_replies switch)
  voice_notes: false
  # Step 31 (2026-08-20): the local-TUI block left with the deleted
  # terminal TUI — the schema's LocalTuiConfig defaults say the same
  # thing (enabled true, push_to_talk), so snapshots are unchanged.
features:
  # 2026-10-13 (R14, the owner: "...should get web search"): a friend's turn may use web_search and
  # nothing else of the owner's; capped per account per hour and per room per day.
  guest_web_search: true
  guest_web_searches_per_hour: 5
  guest_web_searches_per_room_per_day: 60
  # The off switch for every message PaLLi starts on its own (read again since
  # 2026-10-14, core/turn/companion_flags.speaks_first_on): false stops its
  # reach-outs and shares to you, its group openers and the hunch rail at once.
  # Reminders and its replies to you never ask it. How many a day:
  # companion.arbiter_daily_send_ceiling (to you), companion.group_openers_per_day.
  #
  # 2026-06-10 — quiet hours effectively disabled (was 07:00-22:30 allowed).
  # A fixed window can starve outreach completely for an owner who keeps
  # unusual hours: their activity expires before the window opens, the two
  # gates never overlap, and nothing is ever sent. The 4h activity window is
  # the guard instead: PaLLi only reaches out within 4h of the owner being
  # around, at any hour. Restore start: 7 / end 22:30 for a conventional
  # window.
  proactive_conversations: true
  # 2026-07-01 — candidate rail live: monologue hunches rejoin outreach.
  # Observation hunches become open threads (decide_surface picks the
  # moment); action hunches run a quiet read-only local action and report
  # back (Jarvis path). Set false to keep hunches conversational-only.
  #
  # 2026-07-29 — set to FALSE to PRESERVE BEHAVIOUR, not to change it.
  # This read `true` for four weeks and did nothing: ai/proactive_policy.py
  # referenced an undefined `logger`, so every _outreach_allowed call raised
  # NameError, was caught, and failed closed. The action branch is gated on
  # that call, so no autonomous action has ever fired. Repairing the module
  # (same day) would have switched this rail on for the first time, silently,
  # on the restart after a user migration — unattended `local_shell` running
  # as her own user, which can sudo to palli-work. That is a capability
  # decision, not a bugfix side effect, so it waits for the owner.
  # Observation hunches still become open threads either way; only the
  # act-then-report path is off. Flip to true when you want it, deliberately.
  proactive_actions: false
  web_search: false
  # Her Hands (step 33): voice/people/sends/presence on her toolbelt.
  # Full trust (owner 2026-08-11): no ceremonies, no caps, her judgment —
  # owner-only tools, workbench excluded, every act leaves a record.
  her_hands: true
  # experimental — builds and hot-installs her own tools in-process;
  # turn on when you have read SETUP.md's forge section
  forged_tools: false
  home_assistant: false
  open_threads_surface_interval_minutes: 30
  open_threads_surface_activity_window_hours: 4.0
  open_threads_surface_quiet_hours_start: 0
  open_threads_surface_quiet_hours_end_hour: 23
  open_threads_surface_quiet_hours_end_minute: 59
  open_threads_post_surface_backoff_multiplier: 4
  # Batch 8 (2026-10-01, wrap): the page reader — text only, size-capped, never an internal address
  read_page: true
channels:
  discord:
    enabled: true
  telegram:
    enabled: false
  slack:
    enabled: false
policy:
  # Read by nothing since step 19 (2026-08-19); kept so older files still load.
  # The real daily cap is companion.arbiter_daily_send_ceiling.
  proactive:
    max_per_day: 3
    min_gap_hours: 2.0
  operator:
    browser_enabled: true
    desktop_enabled: true
presets:
  # 2026-09-03 (configurator spec §3.3 R2/R2b): every preset is a WHOLE answer to
  # "who is thinking for her" — all ten lanes named, plus the env half her brain
  # actually reads. Her voice (the ReAct runner) takes LLM_PROVIDER and
  # LLM_RESPONSE_MODEL from .env.local and never reads llm.routing.response; the
  # routing.response row is kept in step so every surface agrees. A lane a preset
  # deliberately leaves elsewhere is named, never omitted (tests/core/
  # test_presets_complete.py). Apply with `palli_ctl brain <name>`; see the live
  # picture with `palli_ctl brain --show`.
  #
  # deepseek-primary — what she runs today; the way home. The story lane stays on
  # the Claude subscription (DeepSeek V4's reasoning eats any budget on that task
  # shape — see the note at llm.routing.narrative_author) and vision stays on
  # Claude Haiku (DeepSeek has no eyes).
  deepseek-primary:
    overrides:
      llm.default_provider: deepseek
      llm.routing.response: {provider: deepseek, model: deepseek-v4-flash}
      llm.routing.decision: {provider: deepseek, model: deepseek-v4-flash}
      llm.routing.analysis: {provider: deepseek, model: deepseek-v4-flash}
      llm.routing.appraisal: {provider: deepseek, model: deepseek-v4-flash}
      llm.routing.memory: {provider: deepseek, model: deepseek-v4-flash}
      llm.routing.proactive: {provider: deepseek, model: deepseek-v4-flash}
      llm.routing.reflection: {provider: deepseek, model: deepseek-v4-flash}
      llm.routing.web_search: {provider: deepseek, model: deepseek-v4-flash}
      llm.routing.narrative_author: {provider: claude, model: sonnet}
      llm.routing.vision: {provider: claude, model: haiku}
    env:
      LLM_PROVIDER: deepseek
      LLM_RESPONSE_MODEL: deepseek-v4-flash
      DEEPSEEK_MODEL: deepseek-v4-flash
  # anthropic-primary — Claude Opus 5 through the API on every text lane. Her voice
  # is REFUSED by `palli_ctl brain` until the native path lands
  # (ANTHROPIC_BRAIN_KICKOFF.md); `--except response` moves the rest today.
  # Vision stays on Claude Haiku via the CLI: the API provider routes text-only here.
  anthropic-primary:
    overrides:
      llm.default_provider: anthropic
      llm.routing.response: {provider: anthropic, model: claude-opus-5}
      llm.routing.decision: {provider: anthropic, model: claude-opus-5}
      llm.routing.analysis: {provider: anthropic, model: claude-opus-5}
      llm.routing.appraisal: {provider: anthropic, model: claude-opus-5}
      llm.routing.memory: {provider: anthropic, model: claude-opus-5}
      llm.routing.proactive: {provider: anthropic, model: claude-opus-5}
      llm.routing.reflection: {provider: anthropic, model: claude-opus-5}
      llm.routing.web_search: {provider: anthropic, model: claude-opus-5}
      llm.routing.narrative_author: {provider: anthropic, model: claude-opus-5}
      llm.routing.vision: {provider: claude, model: haiku}
    env:
      LLM_PROVIDER: anthropic
      LLM_RESPONSE_MODEL: claude-opus-5
      ANTHROPIC_MODEL: claude-opus-5
  # openai-primary — GPT-4o everywhere (it has eyes, so vision moves too).
  openai-primary:
    overrides:
      llm.default_provider: openai
      llm.routing.response: {provider: openai, model: gpt-4o}
      llm.routing.decision: {provider: openai, model: gpt-4o}
      llm.routing.analysis: {provider: openai, model: gpt-4o}
      llm.routing.appraisal: {provider: openai, model: gpt-4o}
      llm.routing.memory: {provider: openai, model: gpt-4o}
      llm.routing.proactive: {provider: openai, model: gpt-4o}
      llm.routing.reflection: {provider: openai, model: gpt-4o}
      llm.routing.web_search: {provider: openai, model: gpt-4o}
      llm.routing.narrative_author: {provider: openai, model: gpt-4o}
      llm.routing.vision: {provider: openai, model: gpt-4o}
    env:
      LLM_PROVIDER: openai
      LLM_RESPONSE_MODEL: gpt-4o
      OPENAI_MODEL: gpt-4o
  # codex-primary — the Codex subscription on every text lane. Her voice is REFUSED
  # (the CLI emulates tool calls; 0 measured 2026-09-02); the background moves with
  # `--except response`. Codex has no eyes: vision stays on Claude Haiku.
  codex-primary:
    overrides:
      llm.default_provider: codex
      llm.routing.response: {provider: codex, model: gpt-5.5}
      llm.routing.decision: {provider: codex, model: gpt-5.5}
      llm.routing.analysis: {provider: codex, model: gpt-5.5}
      llm.routing.appraisal: {provider: codex, model: gpt-5.5}
      llm.routing.memory: {provider: codex, model: gpt-5.5}
      llm.routing.proactive: {provider: codex, model: gpt-5.5}
      llm.routing.reflection: {provider: codex, model: gpt-5.5}
      llm.routing.web_search: {provider: codex, model: gpt-5.5}
      llm.routing.narrative_author: {provider: codex, model: gpt-5.5}
      llm.routing.vision: {provider: claude, model: haiku}
    env:
      LLM_PROVIDER: codex
      LLM_RESPONSE_MODEL: gpt-5.5
      CODEX_MODEL: gpt-5.5
  # claude-oauth — the Claude Max subscription on every lane (no per-token cost).
  # Her voice is REFUSED (same emulated-tool-call reason as codex); use
  # `palli_ctl brain claude-oauth --except response` to move the nine background
  # lanes and leave her voice where it is. Vision on Claude Haiku (proven live).
  claude-oauth:
    overrides:
      llm.default_provider: claude
      llm.routing.response: {provider: claude, model: sonnet}
      llm.routing.decision: {provider: claude, model: sonnet}
      llm.routing.analysis: {provider: claude, model: sonnet}
      llm.routing.appraisal: {provider: claude, model: sonnet}
      llm.routing.memory: {provider: claude, model: sonnet}
      llm.routing.proactive: {provider: claude, model: sonnet}
      llm.routing.reflection: {provider: claude, model: sonnet}
      llm.routing.web_search: {provider: claude, model: sonnet}
      llm.routing.narrative_author: {provider: claude, model: sonnet}
      llm.routing.vision: {provider: claude, model: haiku}
    env:
      LLM_PROVIDER: claude
      LLM_RESPONSE_MODEL: sonnet
      CLAUDE_CLI_MODEL: sonnet
  # ollama-primary — the desktop's Ollama through its NATIVE API. Fine for every
  # background lane; her voice is REFUSED because this door reaches the runner
  # through the text-tag adapter (0 tool calls, the Qwen evening). For a fully
  # local brain use `local-only`, which goes through Ollama's OpenAI-style door.
  ollama-primary:
    overrides:
      llm.default_provider: ollama
      llm.routing.response: {provider: ollama, model: qwen3.5:9b}
      llm.routing.decision: {provider: ollama, model: qwen3.5:9b}
      llm.routing.analysis: {provider: ollama, model: qwen3.5:9b}
      llm.routing.appraisal: {provider: ollama, model: qwen3.5:9b}
      llm.routing.memory: {provider: ollama, model: qwen3.5:9b}
      llm.routing.proactive: {provider: ollama, model: qwen3.5:9b}
      llm.routing.reflection: {provider: ollama, model: qwen3.5:9b}
      llm.routing.web_search: {provider: ollama, model: qwen3.5:9b}
      llm.routing.narrative_author: {provider: ollama, model: qwen3.5:9b}
      llm.routing.vision: {provider: ollama, model: gemma3:12b}
    env:
      LLM_PROVIDER: ollama
      LLM_RESPONSE_MODEL: qwen3.5:9b
      OLLAMA_MODEL: qwen3.5:9b
  # local-only — everything on the desktop, nothing leaves the LAN. The only fully
  # local preset that can drive her voice: local_openai is Ollama's OpenAI-style
  # endpoint, where her tool calls are real (2026-09-02). Vision uses the native
  # door's gemma3:12b (the one multimodal model on the box). Voice stays local too.
  local-only:
    overrides:
      llm.default_provider: local_openai
      llm.routing.response: {provider: local_openai, model: qwen3.5:9b}
      llm.routing.decision: {provider: local_openai, model: qwen3.5:9b}
      llm.routing.analysis: {provider: local_openai, model: qwen3.5:9b}
      llm.routing.appraisal: {provider: local_openai, model: qwen3.5:9b}
      llm.routing.memory: {provider: local_openai, model: qwen3.5:9b}
      llm.routing.proactive: {provider: local_openai, model: qwen3.5:9b}
      llm.routing.reflection: {provider: local_openai, model: qwen3.5:9b}
      llm.routing.web_search: {provider: local_openai, model: qwen3.5:9b}
      llm.routing.narrative_author: {provider: local_openai, model: qwen3.5:9b}
      llm.routing.vision: {provider: ollama, model: gemma3:12b}
      voice.stt_provider: faster_whisper
      voice.tts_provider: pyttsx3
    env:
      LLM_PROVIDER: local_openai
      LLM_RESPONSE_MODEL: qwen3.5:9b
      LOCAL_LLM_MODEL: qwen3.5:9b
  # hybrid — the judgment-heavy, user-facing lanes think with Claude Opus 5; the
  # background stays on the desktop for cost and privacy. Her voice is REFUSED
  # until the native Anthropic path lands (see anthropic-primary). Unrouted callers
  # (no routing row) follow llm.default_provider = ollama, i.e. stay local.
  hybrid:
    overrides:
      llm.default_provider: ollama
      llm.routing.response: {provider: anthropic, model: claude-opus-5}
      llm.routing.decision: {provider: anthropic, model: claude-opus-5}
      llm.routing.analysis: {provider: anthropic, model: claude-opus-5}
      llm.routing.appraisal: {provider: anthropic, model: claude-opus-5}
      llm.routing.memory: {provider: ollama, model: qwen3.5:9b}
      llm.routing.proactive: {provider: ollama, model: qwen3.5:9b}
      llm.routing.reflection: {provider: ollama, model: qwen3.5:9b}
      llm.routing.web_search: {provider: ollama, model: qwen3.5:9b}
      llm.routing.narrative_author: {provider: ollama, model: qwen3.5:9b}
      llm.routing.vision: {provider: ollama, model: gemma3:12b}
    env:
      LLM_PROVIDER: anthropic
      LLM_RESPONSE_MODEL: claude-opus-5
      ANTHROPIC_MODEL: claude-opus-5
compaction:
  enabled: true
  trigger_tokens: 6000
  trigger_turns: 40
  recent_turns_kept: 12
  min_interval_seconds: 300
  # 2026-06-10 — was bare `qwen3:8b`, which resolved to Ollama and errored
  # whenever the LAN box slept (digest catch-up failures). Explicit deepseek
